<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de flujo del sistema de entregas digitales</title><desc id="desc">Inicio, carga de datos, menú, validación de opciones y entradas, ejecución de operaciones, retorno al menú y salida.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173655"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#152d45;font-size:18px}.small{font-size:15px}.label{font-weight:bold}.shape{fill:#fff;stroke:#173655;stroke-width:2}.decision{fill:#e6f1fa;stroke:#173655;stroke-width:2}.line{fill:none;stroke:#173655;stroke-width:2.5;marker-end:url(#a)}.head{fill:#fff;font-size:25px;font-weight:bold}.sub{fill:#dbe9f5;font-size:17px}</style>
<rect width="1000" height="1060" fill="#fff"/>
<rect x="24" y="18" width="952" height="77" rx="12" fill="#173655"/>
<text x="500" y="49" text-anchor="middle" class="head">Sistema de entregas digitales</text><text x="500" y="76" text-anchor="middle" class="sub">Laboratorio 07 · Diagrama de flujo</text>
<ellipse cx="500" cy="128" rx="80" ry="23" class="decision"/><text x="500" y="135" text-anchor="middle" class="label">Inicio</text>
<path d="M500 151V167" class="line"/>
<rect x="335" y="170" width="330" height="52" rx="5" class="shape"/><text x="500" y="192" text-anchor="middle">Cargar 8 entregas simuladas</text><text x="500" y="211" text-anchor="middle" class="small">Cinco arreglos paralelos</text>
<path d="M500 222V239" class="line"/>
<rect x="360" y="242" width="280" height="45" rx="5" class="shape"/><text x="500" y="270" text-anchor="middle" class="label">Mostrar menú principal</text>
<path d="M500 287V304" class="line"/>
<path d="M385 307H635L615 350H365Z" class="shape"/><text x="500" y="334" text-anchor="middle">Leer opción</text>
<path d="M500 350V368" class="line"/>
<path d="M500 372L650 413L500 454L350 413Z" class="decision"/><text x="500" y="409" text-anchor="middle" class="label">¿Opción válida?</text><text x="500" y="428" text-anchor="middle" class="small">Entero de 0 a 7</text>
<path d="M650 413H725" class="line"/><text x="680" y="402" class="small">No</text>
<rect x="728" y="390" width="222" height="46" rx="5" class="shape"/><text x="839" y="418" text-anchor="middle">Opción no válida</text>
<path d="M950 413H970V264H643" class="line"/>
<path d="M500 454V475" class="line"/><text x="514" y="470" class="small">Sí</text>
<path d="M500 478L610 512L500 546L390 512Z" class="decision"/><text x="500" y="518" text-anchor="middle" class="label">¿Opción 0?</text>
<path d="M610 512H725" class="line"/><text x="665" y="502" class="small">Sí</text>
<rect x="728" y="490" width="222" height="45" rx="5" class="shape"/><text x="839" y="518" text-anchor="middle">Mensaje de salida</text>
<path d="M839 535V555" class="line"/><ellipse cx="839" cy="582" rx="74" ry="24" class="decision"/><text x="839" y="588" text-anchor="middle" class="label">Fin</text>
<path d="M500 546V570" class="line"/><text x="514" y="563" class="small">No</text>
<rect x="270" y="573" width="460" height="93" rx="5" class="shape"/><text x="500" y="596" text-anchor="middle" class="label">Seleccionar operación y leer datos</text><text x="500" y="619" text-anchor="middle" class="small">3, 4 y 6: código o palabra según corresponda</text><text x="500" y="641" text-anchor="middle" class="small">5: entero de 0 a 12 · 7: base de -10 a 10 y exponente de 0 a 9</text>
<path d="M500 666V685" class="line"/>
<path d="M500 688L660 730L500 772L340 730Z" class="decision"/><text x="500" y="724" text-anchor="middle" class="label">¿Datos válidos?</text><text x="500" y="745" text-anchor="middle" class="small">Cuando corresponda</text>
<path d="M340 730H205" class="line"/><text x="260" y="719" class="small">No</text>
<rect x="34" y="706" width="168" height="48" rx="5" class="shape"/><text x="118" y="735" text-anchor="middle">Mostrar error</text>
<path d="M34 730H18V264H357" class="line"/>
<path d="M500 772V792" class="line"/><text x="515" y="788" class="small">Sí</text>
<rect x="235" y="795" width="530" height="175" rx="7" class="shape"/>
<text x="500" y="820" text-anchor="middle" class="label">Ejecutar la operación seleccionada</text>
<text x="260" y="848" class="small">1. Mostrar entregas</text><text x="260" y="873" class="small">2. SumarPuntajes</text><text x="260" y="898" class="small">3. BuscarCodigo</text><text x="260" y="923" class="small">4. ContarArchivos</text>
<text x="510" y="848" class="small">5. Factorial</text><text x="510" y="873" class="small">6. CompararSoluciones</text><text x="510" y="898" class="small">7. Potencia</text>
<text x="500" y="951" text-anchor="middle" class="small">Mostrar el resultado o el mensaje de búsqueda sin coincidencia</text>
<path d="M500 970V1001H45V280H357" class="line"/><text x="272" y="1027" text-anchor="middle" class="small">Volver al menú</text>
</svg>